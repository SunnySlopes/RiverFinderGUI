import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
group 'org.example'
version '1.1.1'
repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        url "https://maven.seedfinding.com"
    }
    maven {
        url "https://maven.latticg.com"
    }
    maven {
        url "https://jitpack.io"
    }
    maven { url "https://repo.jellejurre.dev" }
}
dependencies {
    // Native artifacts produced by :riverfinder CMake build
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

// 配置 Shadow JAR
shadowJar {
    archiveBaseName.set('RiverFinder')
    archiveClassifier.set('')
    mergeServiceFiles()
}

def generatedNativeResourcesDir = layout.buildDirectory.dir('generated/native-resources')
def nativeOutputDir = project(':riverfinder').layout.buildDirectory.dir('native')

tasks.register('prepareNativeResources') {
    group = 'build'
    description = 'Builds :riverfinder (RiverFinderBase submodule) and packs Windows dll into jar resources'
    dependsOn ':riverfinder:copyNativeArtifacts'
    inputs.files(nativeOutputDir).optional()
    outputs.dir(generatedNativeResourcesDir)
    doLast {
        def outDir = generatedNativeResourcesDir.get().asFile
        delete(outDir)
        outDir.mkdirs()

        def nativeDir = nativeOutputDir.get().asFile
        if (!nativeDir.exists()) {
            logger.warn('No native artifacts from :riverfinder; jar will not contain bundled natives.')
            return
        }

        // Windows-only packaging (MSYS2 build); skip linux/macos natives
        copy {
            from(nativeDir)
            include('*.dll')
            into(new File(outDir, 'native/windows'))
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('prepareNativeResources')
    from(generatedNativeResourcesDir)
}

// 创建 RiverFinder 的可执行 JAR（含原生库）
tasks.register('buildMainJar', ShadowJar) {
    group = 'build'
    description = 'Creates a fat JAR for RiverFinder (includes native libs from :riverfinder)'
    dependsOn prepareNativeResources
    archiveBaseName.set('RiverFinder')
    archiveClassifier.set('')
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'sunnyslopes.riverfinder.RiverFinderFrame'
        attributes 'Multi-Release': 'true'
    }
    mergeServiceFiles()
    transform(Log4j2PluginsCacheFileTransformer)
    transform(PropertiesFileTransformer) {
        paths = ['META-INF/spring.handlers', 'META-INF/spring.schemas']
        mergeStrategy = "append"
    }
    exclude 'module-info.class'
}

tasks.register('buildAllJars') {
    group = 'build'
    description = 'Builds all executable JARs'
    dependsOn buildMainJar
}

tasks.register('buildNative') {
    group = 'build'
    description = 'Builds riverfinder native library via subproject'
    dependsOn ':riverfinder:copyNativeArtifacts'
}

tasks.named('build') {
    dependsOn buildMainJar
}
